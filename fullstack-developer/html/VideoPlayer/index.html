<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Working with the HTML Video Element</title>
</head>
<body>
    <h1>Working with the HTML Video Element</h1>
    <video width="640" loop controls muted poster="https://cdn.freecodecamp.org/curriculum/labs/past-event2.jpg">
        <!--The controls boolean attribute provides playback controls including playback, rewind, and volume control for the video element.-->
        <!--The muted boolean attribute will silence audio on initial playback. If you have controls enabled, the user will be able to unmute audio. Omitting the muted attribute will play audio on initial playback.-->
        <!--The poster attribute is a thumbnail image of the video. -->
        <!--When it comes to video file types, there are differences in browser support. To accommodate this, you can use source elements inside the video element and the browser will select the first compatible source.-->
        <source src="https://cdn.freecodecamp.org/curriculum/labs/what-is-the-map-method-and-how-does-it-work.mp4" type="video/mp4">
        <source src="https://cdn.freecodecamp.org/curriculum/labs/mapmethod.webm" type="video/webm">
        <source src="https://cdn.freecodecamp.org/curriculum/labs/mapmethod.ogg" type="video/ogg">
        <source src="https://cdn.freecodecamp.org/curriculum/labs/mapmethod.mov" type="video/quicktime">
        <!--
            MIME (video/mp4, video/webm, ...) (Multipurpose Internet Mail Extensions) is a standard to describe documents in other forms besides ASCII text, for example, audio, video, and images.

            MP4, formally known as MPEG-4 Part 14, is a digital multimedia container format.It is widely used for storing video and audio, but it can also include other data types like subtitles and still images.
            WebM is an open-source audiovisual media file format developed by Google, primarily designed for web-based media content. supports video codecs like VP8, VP9, and AV1, and audio codecs such as Vorbis and Opus. Popular for HTLM5
            Ogg is a digital multimedia container format designed to provide for efficient streaming and manipulation of digital multimedia. It is maintained by the Xiph.Org Foundation and is free and open, unrestricted by software patents.
            QuickTime is an extensible multimedia architecture created by Apple, which supports playing, streaming, encoding, and transcoding a variety of digital media formats. Not as popular as the MP4 format, you may need it for legacy application support.
        -->
    </video>

</body>
</html>
