<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display Videos in an iframe</title>
  </head>
  <body>
    <h1>iframe Video Display</h1>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/I0_951_MPE0"
      allow="accelerometer autoplay clipboard-write encrypted-media gyroscope web-share"
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    >
        <!--
        One of the attributes is allow. It's like a permission list that tells the browser what features the iframe is allowed to use.
        - accelerometer: lets the iframe use motion sensors so it can detect things like device tilting and rotation.
        - autoplay: lets the video start playing automatically,
        - clipboard-write: lets the iframe write data to the user’s clipboard
        - encrypted-media: encrypted media extensions to protect the video
        - gyroscope: grant access to the device’s motion and orientation sensors
        - web-share: allow sharing the iframe content through the device's native share dialogs.
        -->
        <!--
        referrerpolicy: rule that determines how much detail you share when your page connects to another page.
          - strict-origin-when-cross-origin: shares the full address on the same site, only the site name on other sites, and nothing on insecure sites.
        -->
    </iframe>
  </body>
</html>
